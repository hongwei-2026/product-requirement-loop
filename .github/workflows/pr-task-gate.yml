name: Task PR gate + auto review

# 文档/安全校验必须跑 PR head 代码，故用 pull_request（非 target）。
# fork PR 上发评论可能 403 → 下面 try/catch，不因评论失败判红。
# 若 fork 仍挂旧 workflow：maintainer 点 Update branch 合入 main 即可。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r project/requirements.txt
          pip install bandit

      - name: Docs / lessons / security gates
        run: |
          set -euo pipefail
          python scripts/verify_docs_layout.py
          python scripts/verify_lessons.py
          python scripts/verify_security.py

      - name: Enforce one open PR per author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 同一账号同时只能有 1 个未关闭 PR（含本 PR）
            const opens = await github.paginate(github.rest.pulls.list, {
              owner: owner,
              repo: repo,
              state: 'open',
              per_page: 100
            });
            const mine = opens.filter(function (p) {
              return p.user && p.user.login && p.user.login.toLowerCase() === author.toLowerCase();
            });
            if (mine.length > 1) {
              const others = mine
                .filter(function (p) { return p.number !== pr.number; })
                .map(function (p) { return '#' + p.number + ' ' + (p.title || ''); });
              core.setFailed(
                '⛔ 同一账号同时只能有 1 个未关闭的 PR 提交，不能并行多个。\n' +
                '@' + author + ' 当前还有：\n- ' + others.join('\n- ') + '\n' +
                '请先关闭或合并其它 PR，只保留这一个再推送。'
              );
              return;
            }
            core.info('One-open-PR check OK for @' + author);

      - name: Enforce assignee for Implementation PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const body = pr.body || '';
            const author = pr.user.login;
            const isDesign = /\[Design\]/i.test(title) || /## 类型[\s\S]*Design/i.test(body);
            const isImpl = /\[Impl\]/i.test(title) || /Fixes\s+#\d+/i.test(body) || /Closes\s+#\d+/i.test(body);

            // extract issue number
            let issueNo = null;
            const m = body.match(/(?:Fixes|Closes|Resolves)\s+#(\d+)/i) || title.match(/#(\d+)/);
            if (m) issueNo = parseInt(m[1], 10);

            if (isDesign && !/Fixes\s+#/i.test(body)) {
              core.info('Design PR — skip assignee lock');
            } else if (isImpl || issueNo) {
              if (!issueNo) {
                core.setFailed('Implementation PR 必须在正文写 Fixes #<issue>');
                return;
              }
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNo
              });
              const assignees = (issue.assignees || []).map(a => a.login);
              const locked = (issue.labels || []).some(l => l.name === 'status:locked');
              if (locked || assignees.length) {
                if (!assignees.includes(author)) {
                  core.setFailed(
                    `任务 #${issueNo} 已锁定给 ${assignees.join(', ') || '(无人)'}，PR 作者 @${author} 不是受指派人。`
                  );
                  return;
                }
              } else {
                core.warning(`Issue #${issueNo} 尚未 /accept 锁定；实现 PR 建议等维护者 accept 后再合入。`);
              }
            }
