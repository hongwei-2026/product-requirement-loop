name: Task PR gate + auto review

# 文档/安全校验跑 PR head；docs-only 走轻量路径以加速 CI。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(git diff --name-only "$BASE"..."$HEAD" || true)
          echo "changed=${#FILES[@]}"
          needs_python=false
          docs_only=true
          for f in "${FILES[@]}"; do
            case "$f" in
              docs/*|*.md|LICENSE*|LICENSE.txt|.gitignore)
                ;;
              .github/PULL_REQUEST_TEMPLATE/*|.github/CODEOWNERS)
                ;;
              *)
                docs_only=false
                needs_python=true
                ;;
            esac
            case "$f" in
              project/*|scripts/verify_*.py|scripts/*.py)
                needs_python=true
                ;;
            esac
          done
          # 纯文档/模板也跑 layout；代码改动才装全量 deps + lessons/security
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "needs_python=$needs_python" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (code PRs)
        if: steps.scope.outputs.needs_python == 'true'
        run: |
          python -m pip install -U pip
          pip install -r project/requirements.txt
          pip install bandit

      - name: Docs layout gate
        run: python scripts/verify_docs_layout.py

      - name: Lessons + security gates
        if: steps.scope.outputs.needs_python == 'true'
        run: |
          set -euo pipefail
          python scripts/verify_lessons.py
          python scripts/verify_security.py

      - name: Enforce contributor self + AI disclosure
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = (pr.user && pr.user.login) ? pr.user.login : '';
            const body = pr.body || '';
            const title = pr.title || '';

            function hasSection(name) {
              return new RegExp('##\\s*' + name, 'i').test(body);
            }

            const missing = [];
            if (!hasSection('贡献者声明')) missing.push('「## 贡献者声明」');
            if (!hasSection('AI 使用说明')) missing.push('「## AI 使用说明」');

            // 本人勾选
            if (!/\[\s*x\s*\]\s*\*?\*?本人/i.test(body) && !/本人\s*独立提交/i.test(body)) {
              missing.push('勾选「本人独立提交本 PR」');
            }

            // 正文须出现贡献者本人：优先 PR 作者；维护者代整理文档时须写「内容作者 @原作者」
            const MAINTAINERS = ['hongwei-2026'];
            const mentioned = body.match(/@([A-Za-z0-9-]+)/g) || [];
            const authorLower = author.toLowerCase();
            let hasSelf = false;
            for (let i = 0; i < mentioned.length; i++) {
              if (mentioned[i].slice(1).toLowerCase() === authorLower) { hasSelf = true; break; }
            }
            const contentAuthor = body.match(/(?:内容作者|原始贡献者|贡献者)\s*[@：:]*\s*@?([A-Za-z0-9-]+)/i);
            const isMaintainer = MAINTAINERS.indexOf(authorLower) !== -1;
            if (!hasSelf && isMaintainer && contentAuthor) {
              hasSelf = true;
              core.info('Maintainer PR with content author @' + contentAuthor[1]);
            }
            if (!hasSelf) {
              missing.push('贡献者声明中填写与 PR 作者一致的 @' + author + '（或维护者代提时写「内容作者 @原作者」）');
            }

            // AI 说明：须表态是否使用 + 工具/无
            if (!/是否使用 AI/i.test(body) && !/使用了哪些工具/i.test(body)) {
              missing.push('AI 使用说明（是否使用 / 工具名称或写「无」）');
            }
            if (/是否使用 AI 辅助：\s*$/m.test(body) || /使用了哪些工具[^：\n]*：\s*$/m.test(body)) {
              missing.push('AI 使用说明不能留空');
            }

            if (missing.length) {
              core.setFailed(
                '⛔ PR 正文不符合贡献规范，请补全：\n- ' + missing.join('\n- ') +
                '\n\n可选用 PR 模板 Design / Implementation / docs，须含「贡献者声明」「AI 使用说明」。' +
                '\nPR 作者必须是贡献者本人（@' + author + '）。'
              );
              return;
            }
            core.info('Contributor self + AI disclosure OK for @' + author);

      - name: Enforce one open PR per author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const opens = await github.paginate(github.rest.pulls.list, {
              owner: owner,
              repo: repo,
              state: 'open',
              per_page: 100
            });
            const mine = opens.filter(function (p) {
              return p.user && p.user.login && p.user.login.toLowerCase() === author.toLowerCase();
            });
            if (mine.length > 1) {
              const others = mine
                .filter(function (p) { return p.number !== pr.number; })
                .map(function (p) { return '#' + p.number + ' ' + (p.title || ''); });
              core.setFailed(
                '⛔ 同一账号同时只能有 1 个未关闭的 PR 提交，不能并行多个。\n' +
                '@' + author + ' 当前还有：\n- ' + others.join('\n- ') + '\n' +
                '请先关闭或合并其它 PR，只保留这一个再推送。'
              );
              return;
            }
            core.info('One-open-PR check OK for @' + author);

      - name: Enforce assignee for Implementation PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const body = pr.body || '';
            const author = pr.user.login;
            const isDesign = /\[Design\]/i.test(title) || /## 类型[\s\S]*Design/i.test(body);
            const isImpl = /\[Impl\]/i.test(title) || /Fixes\s+#\d+/i.test(body) || /Closes\s+#\d+/i.test(body);

            let issueNo = null;
            const m = body.match(/(?:Fixes|Closes|Resolves)\s+#(\d+)/i) || title.match(/#(\d+)/);
            if (m) issueNo = parseInt(m[1], 10);

            if (isDesign && !/Fixes\s+#/i.test(body)) {
              core.info('Design PR — skip assignee lock');
            } else if (isImpl || (issueNo && /Fixes\s+#/i.test(body))) {
              if (!issueNo) {
                core.setFailed('Implementation PR 必须在正文写 Fixes #<issue>');
                return;
              }
              const issueRes = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNo
              });
              const issue = issueRes.data;
              const assignees = (issue.assignees || []).map(function (a) { return a.login; });
              const locked = (issue.labels || []).some(function (l) { return l.name === 'status:locked'; });
              if (locked || assignees.length) {
                if (assignees.indexOf(author) === -1) {
                  core.setFailed(
                    '任务 #' + issueNo + ' 已锁定给 ' + (assignees.join(', ') || '(无人)') +
                    '，PR 作者 @' + author + ' 不是受指派人。'
                  );
                  return;
                }
              } else {
                core.warning('Issue #' + issueNo + ' 尚未 /accept 锁定；实现 PR 建议等维护者 accept 后再合入。');
              }
            }
