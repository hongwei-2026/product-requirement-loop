name: Task board commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  command:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Handle task commands
        id: cmd
        uses: actions/github-script@v7
        with:
          script: |
            const MAINTAINER = 'hongwei-2026';
            const SCORERS = ['hongwei-2026', 'hl019', 'Jerrybao99', 'likexin105'];
            const CLAIMS_PATH = 'docs/交付/任务认领状态.json';
            const fs = require('fs');

            const body = (context.payload.comment.body || '').trim();
            const lines = body.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const issue = context.payload.issue;
            const actor = context.payload.comment.user.login;
            const issue_number = issue.number;
            const key = String(issue_number);

            const hasLabel = (name) => (issue.labels || []).some(l => l.name === name);
            const ensureLabel = async (name, color, desc) => {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (_) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name, color, description: desc || ''
                });
              }
            };
            const reply = async (text) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body: text
              });
            };
            const loadClaims = () => {
              const raw = JSON.parse(fs.readFileSync(CLAIMS_PATH, 'utf8'));
              if (!raw.claims) raw.claims = {};
              return raw;
            };
            const saveClaims = (data) => {
              fs.writeFileSync(CLAIMS_PATH, JSON.stringify(data, null, 2) + '\n');
              core.setOutput('refresh', '1');
            };
            const stamp = () => new Date().toISOString().slice(0, 19) + 'Z';
            const clearClaim = (data) => {
              if (data.claims[key]) delete data.claims[key];
            };

            // ---------- /claim ----------
            if (lines.some(l => /^\/claim$/i.test(l))) {
              if (!hasLabel('task')) {
                await reply('⚠️ 这不是任务 Issue（缺少 `task` 标签），`/claim` 无效。');
                return;
              }
              if ((issue.assignees || []).length || hasLabel('status:locked')) {
                const who = (issue.assignees || []).map(a => '@' + a.login).join(', ') || '已锁定';
                await reply(`⚠️ 本任务已有人：${who}。放弃请对方 \`/release\`，或维护者 \`/reject-claim\`。`);
                return;
              }
              const data = loadClaims();
              const existing = data.claims[key];
              if (existing && existing.status === 'claim-pending' && existing.user.toLowerCase() !== actor.toLowerCase()) {
                await reply(`⚠️ @${existing.user} 已在 claim-pending。请对方 \`/cancel\`，或维护者 \`/reject-claim\`。`);
                return;
              }
              await ensureLabel('status:claim-pending', 'fbca04', '等待设计PR与维护者accept');
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number,
                labels: ['status:claim-pending']
              });
              data.claims[key] = { user: actor, status: 'claim-pending', updated: stamp() };
              saveClaims(data);
              await reply([
                `✅ **@${actor} 已接取意向**（\`/claim\`）——仪表盘「进行中的认领」将同步。`,
                '',
                '### 下一步',
                '1. 开 **Design PR**：`[Design] #' + issue_number + ' …`',
                '2. 邮件 **feizi_050920@qq.com**（Issue + Design PR + 你的 GitHub ID）',
                '3. 等 @' + MAINTAINER + ' 评论：`/accept @' + actor + '`',
                '',
                '### 若要放弃',
                '在本 Issue 评论（单独一行）：`/cancel` 或 `/release`',
                '认领记录会从仪表盘**自动删除**，任务重新开放。',
                '',
                '指南：`docs/交付/任务贡献指南.md` · 仪表盘：`docs/交付/任务仪表盘.md`'
              ].join('\n'));
              return;
            }

            // ---------- /accept @user ----------
            const acceptLine = lines.find(l => /^\/accept\s+@?[A-Za-z0-9-]+$/i.test(l));
            if (acceptLine) {
              if (actor !== MAINTAINER) {
                await reply('⛔ 仅维护者 `@' + MAINTAINER + '` 可 `/accept`。');
                return;
              }
              let user = acceptLine.replace(/^\/accept\s+/i, '').trim().replace(/^@/, '');
              await ensureLabel('status:locked', '0e8a16', '已锁定指派');
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, name: 'status:claim-pending'
                });
              } catch (_) {}
              await github.rest.issues.addAssignees({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, assignees: [user]
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, labels: ['status:locked']
              });
              const data = loadClaims();
              data.claims[key] = { user, status: 'locked', updated: stamp() };
              saveClaims(data);
              await reply([
                `🔒 **已锁定给 @${user}**。仪表盘状态 → 已锁定实现中。`,
                '请提交 Implementation PR：`Fixes #' + issue_number + '`。',
                '放弃请评论：`/release` 或 `/cancel`（自动清除仪表盘认领）。'
              ].join('\n'));
              return;
            }

            // ---------- /reject-claim /release /cancel ----------
            const isReject = lines.some(l => /^\/reject-claim$/i.test(l));
            const isRelease = lines.some(l => /^\/release$/i.test(l) || /^\/cancel$/i.test(l));
            if (isReject || isRelease) {
              const data = loadClaims();
              const cur = data.claims[key];
              const assignees = (issue.assignees || []).map(a => a.login);
              let allowed = false;
              if (isReject) {
                allowed = actor === MAINTAINER;
                if (!allowed) await reply('⛔ 仅维护者可 `/reject-claim`。');
              } else {
                allowed =
                  actor === MAINTAINER ||
                  assignees.map(a => a.toLowerCase()).includes(actor.toLowerCase()) ||
                  (cur && cur.user && cur.user.toLowerCase() === actor.toLowerCase());
                if (!allowed) {
                  await reply('⛔ 仅「当前认领人 / 受指派人 / 维护者」可 `/release` 或 `/cancel`。');
                }
              }
              if (!allowed) return;

              if (assignees.length) {
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, assignees
                });
              }
              for (const name of ['status:locked', 'status:claim-pending']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number, name
                  });
                } catch (_) {}
              }
              clearClaim(data);
              saveClaims(data);
              await reply(
                '♻️ 已取消认领/锁定。仪表盘「进行中的认领」已**自动删除**该条，任务重新开放，其他人可 `/claim`。'
              );
              return;
            }

            // ---------- /score N ----------
            const scoreLine = lines.find(l => /^\/score\s+\d+$/i.test(l));
            if (scoreLine) {
              if (!SCORERS.map(s => s.toLowerCase()).includes(actor.toLowerCase())) {
                await reply('⛔ 仅维护者/必审人可 `/score`：' + SCORERS.map(s => '@' + s).join(' '));
                return;
              }
              const n = parseInt(scoreLine.replace(/^\/score\s+/i, ''), 10);
              const who = (issue.assignees || [])[0]?.login || (loadClaims().claims[key] || {}).user || actor;
              const path = 'docs/交付/任务计分板.md';
              let text = fs.readFileSync(path, 'utf8');
              const date = new Date().toISOString().slice(0, 10);
              const row = `| ${date} | ${who} | #${issue_number} | ${n} | by ${actor} via /score |`;
              text = text.replace('| — | — | — | — | 尚无计分记录 |', row);
              if (!text.includes(row)) {
                text = text.replace(/(\| -+ \| -+ \| -+ \| -+ \| -+ \|\n)/, `$1${row}\n`);
              }
              const totals = {};
              for (const seed of SCORERS) totals[seed] = 0;
              for (const m of text.matchAll(/\|\s*\d{4}-\d{2}-\d{2}\s*\|\s*([^|]+)\s*\|\s*#\d+\s*\|\s*(\d+)\s*\|/g)) {
                const id = m[1].trim();
                totals[id] = (totals[id] || 0) + parseInt(m[2], 10);
              }
              let totalTable = '| GitHub ID | 总分 |\n|-----------|------|\n';
              for (const id of Object.keys(totals).sort((a, b) => (totals[b] - totals[a]) || a.localeCompare(b))) {
                totalTable += `| ${id} | ${totals[id]} |\n`;
              }
              text = text.replace(/## 累计[\s\S]*$/m, `## 累计（自动汇总）\n\n${totalTable}`);
              fs.writeFileSync(path, text);

              const data = loadClaims();
              data.claims[key] = { user: who, status: 'done', updated: stamp(), points: n };
              saveClaims(data);

              await reply(`🏆 已给 **@${who}** 记 **${n}** 分（#${issue_number}）。排行榜与认领状态将刷新。`);
              return;
            }

      - name: Rebuild dashboard and push
        if: steps.cmd.outputs.refresh == '1'
        run: |
          set -euo pipefail
          python scripts/rebuild_task_dashboard.py
          git config user.name "task-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "docs/交付/任务计分板.md" \
            "docs/交付/任务认领状态.json" \
            "docs/交付/任务仪表盘.md" \
            "docs/dashboard/index.html"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync task claims/scoreboard dashboard"
          git push
