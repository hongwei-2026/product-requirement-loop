name: Task board commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  command:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Handle task commands
        id: cmd
        uses: actions/github-script@v7
        with:
          script: |
            const MAINTAINER = 'hongwei-2026';
            const SCORERS = ['hongwei-2026', 'hl019', 'Jerrybao99', 'likexin105'];
            const CLAIMS_PATH = 'docs/交付/任务认领状态.json';
            const fs = require('fs');

            const body = (context.payload.comment.body || '').trim();
            const lines = body.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const issue = context.payload.issue;
            const actor = context.payload.comment.user.login;
            const issue_number = issue.number;
            const key = String(issue_number);

            const hasLabel = (name) => (issue.labels || []).some(l => l.name === name);
            const ensureLabel = async (name, color, desc) => {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (_) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name, color, description: desc || ''
                });
              }
            };
            const reply = async (text) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body: text
              });
            };
            const loadClaims = () => {
              const raw = JSON.parse(fs.readFileSync(CLAIMS_PATH, 'utf8'));
              if (!raw.claims) raw.claims = {};
              return raw;
            };
            const saveClaims = (data) => {
              fs.writeFileSync(CLAIMS_PATH, JSON.stringify(data, null, 2) + '\n');
              core.setOutput('refresh', '1');
            };
            const stamp = () => new Date().toISOString().slice(0, 19) + 'Z';
            const clearClaim = (data) => {
              if (data.claims[key]) delete data.claims[key];
            };

            // ---------- /claim ----------
            if (lines.some(l => /^\/claim$/i.test(l))) {
              if (!hasLabel('task')) {
                await reply('⚠️ 这不是任务 Issue（缺少 `task` 标签），`/claim` 无效。');
                return;
              }
              if ((issue.assignees || []).length || hasLabel('status:locked')) {
                const who = (issue.assignees || []).map(a => '@' + a.login).join(', ') || '已锁定';
                await reply(`⚠️ 本任务已有人：${who}。放弃请对方 \`/release\`，或维护者 \`/reject-claim\`。`);
                return;
              }
              const data = loadClaims();
              const existing = data.claims[key];
              if (existing && existing.status === 'claim-pending' && existing.user.toLowerCase() !== actor.toLowerCase()) {
                await reply(`⚠️ @${existing.user} 已在 claim-pending。请对方 \`/cancel\`，或维护者 \`/reject-claim\`。`);
                return;
              }
              // 一账号同时只能有 1 个进行中任务（claim-pending 或 locked）
              const busyJson = Object.entries(data.claims).filter(([ik, c]) => {
                if (ik === key) return false;
                if (!c || !c.user) return false;
                if (c.user.toLowerCase() !== actor.toLowerCase()) return false;
                return c.status === 'claim-pending' || c.status === 'locked';
              });
              if (busyJson.length) {
                const list = busyJson.map(([ik, c]) => `#${ik}(${c.status})`).join(', ');
                await reply(
                  `⛔ **一账号同时只能接 1 个任务。** 你仍有进行中：${list}。\n` +
                  `请先在对应 Issue \`/cancel\` 或完成并计分后，再来本 Issue \`/claim\`。`
                );
                return;
              }
              const assigned = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', assignee: actor, labels: 'task', per_page: 100
              });
              const otherAssigned = assigned.filter(i => i.number !== issue_number);
              if (otherAssigned.length) {
                const list = otherAssigned.map(i => `#${i.number}`).join(', ');
                await reply(
                  `⛔ **一账号同时只能接 1 个任务。** 你仍是 Assignee：${list}。\n` +
                  `请先 \`/cancel\`/\`/release\` 或完成后再 \`/claim\`。`
                );
                return;
              }
              await ensureLabel('status:claim-pending', 'fbca04', '等待设计PR与维护者accept');
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number,
                labels: ['status:claim-pending']
              });
              data.claims[key] = { user: actor, status: 'claim-pending', updated: stamp() };
              saveClaims(data);
              await reply([
                `✅ **@${actor} 已登记接取意向**（\`/claim\`）。`,
                '',
                '> **接取人栏此刻不会写你的 ID。** 须等：Design PR 被维护者**合并** → 维护者在本 Issue 评论 \`/accept @' + actor + '\` 之后，接取人才会自动写入。',
                '',
                '> 规则：同一账号同时只能有 1 个进行中意向/锁定。想换题请先 `/cancel`。',
                '> **进度：** 关联 PR 须至少每 **30 天** 有更新，否则任务会被 **自动释放**。',
                '',
                '### 你接下来必须做',
                '1. 写方案：`docs/designs/#' + issue_number + '-….md`',
                '2. 开 **Design PR**（选模板 Design）：标题 `[Design] #' + issue_number + ' …`',
                '3. 邮件 **feizi_050920@qq.com**（Issue + Design PR + GitHub ID）',
                '4. 等 @' + MAINTAINER + ' **合并** Design PR',
                '5. 再等维护者评论：`/accept @' + actor + '` ← 此时 **接取人** 栏才写入你的 ID',
                '6. 之后才能开 Implementation PR（代码 + 视频 + 截图≥2）',
                '',
                '### 若要放弃',
                '`/cancel` 或 `/release`（单独一行）',
                '',
                '指南：`docs/交付/任务贡献指南.md`'
              ].join('\n'));
              return;
            }

            // ---------- /accept @user ----------
            const acceptLine = lines.find(l => /^\/accept\s+@?[A-Za-z0-9-]+$/i.test(l));
            if (acceptLine) {
              if (actor !== MAINTAINER) {
                await reply('⛔ 仅维护者 `@' + MAINTAINER + '` 可 `/accept`。');
                return;
              }
              let user = acceptLine.replace(/^\/accept\s+/i, '').trim().replace(/^@/, '');
              const dataPre = loadClaims();
              const pending = dataPre.claims[key];
              if (!pending || pending.status !== 'claim-pending') {
                await reply(
                  `⛔ 无法 \`/accept @${user}\`：本 Issue 尚无有效的 \`/claim\`（claim-pending）。\n` +
                  `流程必须是：同学 \`/claim\` → Design PR **已合并** → 再 \`/accept\`。`
                );
                return;
              }
              if ((pending.user || '').toLowerCase() !== user.toLowerCase()) {
                await reply(
                  `⛔ 当前 claim-pending 是 @${pending.user}，与 \`/accept @${user}\` 不一致。`
                );
                return;
              }

              // 必须已有「已合并」的 Design PR（标题含 [Design] #N，作者应为接取人）
              const closed = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'closed', sort: 'updated', direction: 'desc', per_page: 50
              });
              const designMerged = closed.filter(p => {
                if (!p.merged_at) return false;
                const t = p.title || '';
                const b = p.body || '';
                const isDesign = /\[Design\]/i.test(t);
                if (!isDesign) return false;
                const mentions =
                  new RegExp('#' + issue_number + '\\b').test(t) ||
                  new RegExp('(?:Related to|关联)\\s*#' + issue_number + '\\b', 'i').test(b) ||
                  new RegExp('docs/designs/#' + issue_number + '[-_]', 'i').test(b);
                return mentions;
              });
              const designByUser = designMerged.find(
                p => (p.user?.login || '').toLowerCase() === user.toLowerCase()
              ) || designMerged[0];
              if (!designByUser) {
                await reply([
                  `⛔ 无法 \`/accept @${user}\`：**尚未找到已合并的 Design PR**（须标题含 \`[Design] #${issue_number}\`）。`,
                  '',
                  '请先审查并 **Merge** 该同学的 Design PR，再在本 Issue（建议回在其 `/claim` 评论下）发送：',
                  `\`/accept @${user}\``,
                  '',
                  '合并后接取人栏才会写入其 GitHub ID。'
                ].join('\n'));
                return;
              }
              if ((designByUser.user?.login || '').toLowerCase() !== user.toLowerCase()) {
                await reply(
                  `⚠️ 已合并 Design PR #${designByUser.number} 作者是 @${designByUser.user?.login}，与 \`/accept @${user}\` 不一致。请核对后再试。`
                );
                return;
              }

              const busyOther = Object.entries(dataPre.claims).filter(([ik, c]) => {
                if (ik === key) return false;
                if (!c || !c.user) return false;
                if (c.user.toLowerCase() !== user.toLowerCase()) return false;
                return c.status === 'claim-pending' || c.status === 'locked';
              });
              const assignedOther = (await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', assignee: user, labels: 'task', per_page: 100
              })).filter(i => i.number !== issue_number);
              if (busyOther.length || assignedOther.length) {
                const list = [
                  ...busyOther.map(([ik, c]) => `#${ik}(${c.status})`),
                  ...assignedOther.map(i => `#${i.number}(assignee)`)
                ].join(', ');
                await reply(`⛔ 无法 \`/accept @${user}\`：其一账号已有进行中任务 ${list}。请先清理后再锁定。`);
                return;
              }
              await ensureLabel('status:locked', '0e8a16', '已锁定指派');
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, name: 'status:claim-pending'
                });
              } catch (_) {}
              await github.rest.issues.addAssignees({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, assignees: [user]
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, labels: ['status:locked']
              });
              const data = dataPre;
              data.claims[key] = {
                user,
                status: 'locked',
                updated: stamp(),
                design_pr: designByUser.number,
                design_merged_at: designByUser.merged_at
              };
              saveClaims(data);

              // 回在同学 /claim 语境下（Issue 评论引用其 /claim）
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100
              });
              const claimComment = [...comments].reverse().find(c =>
                (c.user?.login || '').toLowerCase() === user.toLowerCase() &&
                /^\/claim\b/im.test((c.body || '').trim())
              );
              const acceptBody = [
                claimComment ? `> 回复 @${user} 的 [/claim](${claimComment.html_url})` : `> 批准 @${user} 的接取`,
                '',
                `🔒 **已批准接取 @${user}**（Design PR #${designByUser.number} 已合并）。`,
                '',
                `**接取人栏已自动写入：@${user}**（总览 #7 / 任务列表 / 仪表盘将刷新）。`,
                '',
                '请提交 Implementation PR：`Fixes #' + issue_number + '`。',
                '**交付物三件套**：代码 + **演示视频链接** + **截图≥2**。',
                '放弃：`/release` 或 `/cancel`（接取人栏清空）。',
                '**进度：** 实现 PR 须至少每 **30 天** 有更新，超时将自动释放本任务。'
              ].join('\n');
              await reply(acceptBody);
              return;
            }

            // ---------- /reject-claim /release /cancel ----------
            const isReject = lines.some(l => /^\/reject-claim$/i.test(l));
            const isRelease = lines.some(l => /^\/release$/i.test(l) || /^\/cancel$/i.test(l));
            if (isReject || isRelease) {
              const data = loadClaims();
              const cur = data.claims[key];
              const assignees = (issue.assignees || []).map(a => a.login);
              let allowed = false;
              if (isReject) {
                allowed = actor === MAINTAINER;
                if (!allowed) await reply('⛔ 仅维护者可 `/reject-claim`。');
              } else {
                allowed =
                  actor === MAINTAINER ||
                  assignees.map(a => a.toLowerCase()).includes(actor.toLowerCase()) ||
                  (cur && cur.user && cur.user.toLowerCase() === actor.toLowerCase());
                if (!allowed) {
                  await reply('⛔ 仅「当前认领人 / 受指派人 / 维护者」可 `/release` 或 `/cancel`。');
                }
              }
              if (!allowed) return;

              if (assignees.length) {
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, assignees
                });
              }
              for (const name of ['status:locked', 'status:claim-pending']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number, name
                  });
                } catch (_) {}
              }
              clearClaim(data);
              saveClaims(data);
              await reply(
                '♻️ 已取消认领/锁定。仪表盘「进行中的认领」已**自动删除**该条，任务重新开放，其他人可 `/claim`。'
              );
              return;
            }

            // ---------- /score N ----------
            const scoreLine = lines.find(l => /^\/score\s+\d+$/i.test(l));
            if (scoreLine) {
              if (!SCORERS.map(s => s.toLowerCase()).includes(actor.toLowerCase())) {
                await reply('⛔ 仅维护者/必审人可 `/score`：' + SCORERS.map(s => '@' + s).join(' '));
                return;
              }
              const n = parseInt(scoreLine.replace(/^\/score\s+/i, ''), 10);
              const who = (issue.assignees || [])[0]?.login || (loadClaims().claims[key] || {}).user || actor;
              const path = 'docs/交付/任务计分板.md';
              let text = fs.readFileSync(path, 'utf8');
              const date = new Date().toISOString().slice(0, 10);
              const row = `| ${date} | ${who} | #${issue_number} | ${n} | by ${actor} via /score |`;
              text = text.replace('| — | — | — | — | 尚无计分记录 |', row);
              if (!text.includes(row)) {
                text = text.replace(/(\| -+ \| -+ \| -+ \| -+ \| -+ \|\n)/, `$1${row}\n`);
              }
              const totals = {};
              for (const seed of SCORERS) totals[seed] = 0;
              for (const m of text.matchAll(/\|\s*\d{4}-\d{2}-\d{2}\s*\|\s*([^|]+)\s*\|\s*#\d+\s*\|\s*(\d+)\s*\|/g)) {
                const id = m[1].trim();
                totals[id] = (totals[id] || 0) + parseInt(m[2], 10);
              }
              let totalTable = '| GitHub ID | 总分 |\n|-----------|------|\n';
              for (const id of Object.keys(totals).sort((a, b) => (totals[b] - totals[a]) || a.localeCompare(b))) {
                totalTable += `| ${id} | ${totals[id]} |\n`;
              }
              text = text.replace(/## 累计[\s\S]*$/m, `## 累计（自动汇总）\n\n${totalTable}`);
              fs.writeFileSync(path, text);

              const data = loadClaims();
              data.claims[key] = { user: who, status: 'done', updated: stamp(), points: n };
              saveClaims(data);

              await reply(`🏆 已给 **@${who}** 记 **${n}** 分（#${issue_number}）。排行榜与认领状态将刷新。`);
              return;
            }

      - name: Rebuild dashboard and push
        if: steps.cmd.outputs.refresh == '1'
        run: |
          set -euo pipefail
          python scripts/rebuild_task_dashboard.py
          git config user.name "task-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "docs/交付/任务计分板.md" \
            "docs/交付/任务认领状态.json" \
            "docs/交付/任务仪表盘.md" \
            "docs/交付/任务列表.md" \
            "docs/交付/任务总览-issue7.body.md" \
            "docs/dashboard/index.html"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: sync task claims/assignees on dashboard and hub"
            git push
          fi

      - name: Sync Issue #7 hub table (接取人)
        if: steps.cmd.outputs.refresh == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('docs/交付/任务总览-issue7.body.md', 'utf8');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 7,
              body
            });
            core.info('Updated Issue #7 with claimant column');
