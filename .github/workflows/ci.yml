name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-gates:
    name: Strict delivery gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project/requirements.txt

      - name: Required delivery files must exist
        run: |
          set -euo pipefail
          need=(
            "README.md"
            "docs/交付/结项说明-给审阅同事.md"
            "docs/交付/产品操作手册.md"
            "project/trials/case-01/trial-report.md"
            "project/trials/case-01/golden/accepted.json"
            "project/trials/case-01/golden/active-journal.md"
            "project/check.py"
            "project/loop_runner.py"
            "project/implementation.py"
            "project/product-requirement/specification.yaml"
            "scripts/verify_acceptance.py"
            "setup.sh"
            "start-with-ai.sh"
            "RUN-SERVER.bat"
            "RUN-CHECK.bat"
          )
          for f in "${need[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "[OK] $f"
          done

      - name: Forbid secrets / local env in git tree
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.|credentials\.json|\.pem$'; then
            echo "::error::Secret-like tracked files found"
            exit 1
          fi
          # Scan ALL tracked text including markdown (training repos often paste keys into docs)
          hits=$(git grep -nIE '(sk-[A-Za-z0-9]{20,}|AGNES_API_KEY[[:space:]]*=[[:space:]]*[^y[:space:]]|DEEPSEEK_API_KEY[[:space:]]*=[[:space:]]*[^y[:space:]]|OPENAI_API_KEY[[:space:]]*=[[:space:]]*sk-)' -- . \
            ':(exclude)project/.env.example' \
            || true)
          if [[ -n "${hits}" ]]; then
            echo "::error::Possible API key committed"
            echo "$hits"
            exit 1
          fi
          echo "[OK] no tracked .env / obvious secret assignments"

      - name: Python syntax compile (strict)
        run: |
          set -euo pipefail
          python -m compileall -q -x '(^|/)(\.venv|node_modules|screenshots/node_modules)(/|$)' project scripts
          echo "[OK] compileall"

      - name: Shell script syntax (bash -n)
        run: |
          set -euo pipefail
          bash -n setup.sh
          bash -n start-with-ai.sh
          echo "[OK] bash -n"

      - name: Golden accepted.json structural checks
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("project/trials/case-01/golden/accepted.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          stories = data.get("stories") or []
          assert stories, "golden accepted has no stories"
          for i, s in enumerate(stories):
              assert s.get("approved") is True, f"story[{i}] approved != true"
              assert s.get("revisions"), f"story[{i}] revisions empty"
              assert (s.get("text") or "").startswith("用户要"), f"story[{i}] text format"
              assert s.get("source_quote"), f"story[{i}] missing source_quote"
          review = data.get("review") or {}
          assert review.get("approved") is True, "review.approved != true"
          print(f"[OK] golden accepted: {len(stories)} stories, all approved")
          PY

      - name: Acceptance gates (check.py + trial-report)
        run: |
          set -euo pipefail
          python scripts/verify_acceptance.py

      - name: Trial-report must document all 6 gates
        run: |
          set -euo pipefail
          f="project/trials/case-01/trial-report.md"
          for key in "编造" "source_quote" "覆盖" "反馈" "accepted" "check.py"; do
            if ! grep -q "$key" "$f"; then
              echo "::error::trial-report.md missing keyword: $key"
              exit 1
            fi
          done
          echo "[OK] trial-report keywords"

      - name: Implementation still references official LangGraph executor
        run: |
          set -euo pipefail
          grep -q "LangGraph" project/implementation.py
          grep -q "loop_runner" project/implementation.py
          echo "[OK] implementation.py keeps LangGraph + loop_runner linkage"
