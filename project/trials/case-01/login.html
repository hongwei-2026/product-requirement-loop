<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 产品需求梳理智能体</title>
<style>
:root{--primary:#1677ff;--bg:#f0f2f5;--card:#fff;--text:rgba(0,0,0,.88);--text2:rgba(0,0,0,.55);--border:#f0f0f0;--err:#ff4d4f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#d6e8ff,transparent),linear-gradient(160deg,#eef3f8,#f7f8fa 40%,#e9eef5);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 26px 22px;box-shadow:0 12px 40px rgba(15,35,80,.08)}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#1677ff,#0958d9);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:12px}
h1{margin:0 0 6px;font-size:20px}
.sub{margin:0 0 20px;color:var(--text2);font-size:13px;line-height:1.6}
label{display:block;font-size:12px;color:var(--text2);margin:12px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;font-family:inherit}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.15)}
.btn{width:100%;margin-top:16px;border:none;border-radius:8px;padding:11px 14px;background:var(--primary);color:#fff;font-size:14px;cursor:pointer}
.btn:hover{background:#4096ff}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid #91caff;margin-top:10px}
.err{display:none;margin-top:12px;padding:10px;background:#fff2f0;border:1px solid #ffccc7;color:#cf1322;border-radius:8px;font-size:13px}
.tip{margin-top:16px;padding:10px 12px;background:#e6f4ff;border-radius:8px;font-size:12px;color:#0958d9;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;text-align:center;padding:8px;border-radius:8px;border:1px solid #d9d9d9;background:#fff;cursor:pointer;font-size:13px}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">QT</div>
    <h1>产品需求梳理智能体</h1>
    <p class="sub">先登录再审日志。审核记录会记到你的账号下，方便以后回溯。</p>
    <div class="tabs">
      <button class="tab active" type="button" id="tab-login">登录</button>
      <button class="tab" type="button" id="tab-register">注册</button>
    </div>
    <div id="panel-login">
      <label>用户名</label>
      <input id="login-user" autocomplete="username" placeholder="例如 demo" />
      <label>密码</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="至少 6 位" />
      <button class="btn" type="button" id="btn-login">登录进入</button>
    </div>
    <div id="panel-register" style="display:none">
      <label>用户名</label>
      <input id="reg-user" autocomplete="username" placeholder="新用户名" />
      <label>显示名（审核历史里显示）</label>
      <input id="reg-name" placeholder="例如 张三" />
      <label>密码</label>
      <input id="reg-pass" type="password" autocomplete="new-password" placeholder="至少 6 位" />
      <button class="btn" type="button" id="btn-register">注册并登录</button>
    </div>
    <div class="err" id="err"></div>
    <div class="tip">演示账号：用户名 <strong>demo</strong>，密码 <strong>demo1234</strong><br/>数据库文件：project/data/product_requirement.db</div>
  </div>
<script>
function showErr(msg) {
  const el = document.getElementById('err');
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg || '';
}
async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify(body || {})
  });
  return r.json().catch(() => ({ok:false, error:'服务器无响应'}));
}
document.getElementById('tab-login').onclick = () => {
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-register').classList.remove('active');
  document.getElementById('panel-login').style.display = 'block';
  document.getElementById('panel-register').style.display = 'none';
  showErr('');
};
document.getElementById('tab-register').onclick = () => {
  document.getElementById('tab-register').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  document.getElementById('panel-login').style.display = 'none';
  document.getElementById('panel-register').style.display = 'block';
  showErr('');
};
document.getElementById('btn-login').onclick = async () => {
  showErr('');
  const res = await api('/api/auth/login', {
    username: document.getElementById('login-user').value.trim(),
    password: document.getElementById('login-pass').value
  });
  if (!res.ok) { showErr(res.error || '登录失败'); return; }
  location.href = '/';
};
document.getElementById('btn-register').onclick = async () => {
  showErr('');
  const res = await api('/api/auth/register', {
    username: document.getElementById('reg-user').value.trim(),
    display_name: document.getElementById('reg-name').value.trim(),
    password: document.getElementById('reg-pass').value
  });
  if (!res.ok) { showErr(res.error || '注册失败'); return; }
  location.href = '/';
};
(async () => {
  try {
    const r = await fetch('/api/auth/me', {credentials:'same-origin'});
    const data = await r.json();
    if (data.ok && data.user) location.href = '/';
  } catch (e) {}
})();
</script>
</body>
</html>
