<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">工作台数据流简图</title>
  <desc id="desc">选日志到定稿入库的数据流</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1677ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 22px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #1f1f1f; }
      .sub { font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #8c8c8c; }
      .box-t { font: 700 15px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #1f1f1f; }
      .box-s { font: 400 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #595959; }
      .edge { font: 400 11px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #1677ff; }
      .warn { font: 600 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #cf1322; }
      .hint { font: 400 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #8c8c8c; }
    </style>
  </defs>
  <rect width="1120" height="520" rx="16" fill="#fafcff"/>
  <text x="40" y="42" class="title">工作台数据流（产出 → 下一步输入）</text>
  <text x="40" y="66" class="sub">主路径必须 check 通过后才能定稿入库；批量 AI 只是旁路草稿</text>
  <g filter="url(#shadow)">
    <rect x="36" y="120" width="150" height="88" rx="12" fill="#fff" stroke="#91caff" stroke-width="2"/>
    <text x="111" y="158" text-anchor="middle" class="box-t">① 选日志</text>
    <text x="111" y="182" text-anchor="middle" class="box-s">产出：journal 原文</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="236" y="120" width="150" height="88" rx="12" fill="#fff" stroke="#91caff" stroke-width="2"/>
    <text x="311" y="152" text-anchor="middle" class="box-t">② Step1</text>
    <text x="311" y="174" text-anchor="middle" class="box-s">产出：需求故事.md</text>
    <text x="311" y="192" text-anchor="middle" class="box-s">人审通过后锁定</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="436" y="120" width="150" height="88" rx="12" fill="#fff" stroke="#91caff" stroke-width="2"/>
    <text x="511" y="152" text-anchor="middle" class="box-t">③ Step2</text>
    <text x="511" y="174" text-anchor="middle" class="box-s">产出：stories.json</text>
    <text x="511" y="192" text-anchor="middle" class="box-s">人审通过</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="636" y="112" width="168" height="104" rx="12" fill="#e6f4ff" stroke="#1677ff" stroke-width="2.5"/>
    <text x="720" y="148" text-anchor="middle" class="box-t">④ Step3 check</text>
    <text x="720" y="172" text-anchor="middle" class="box-s">编造 / 句式等门槛</text>
    <text x="720" y="194" text-anchor="middle" class="warn">未通过 → 不可入库</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="864" y="120" width="220" height="88" rx="12" fill="#f6ffed" stroke="#95de64" stroke-width="2"/>
    <text x="974" y="152" text-anchor="middle" class="box-t">⑤ 定稿入库</text>
    <text x="974" y="174" text-anchor="middle" class="box-s">accepted.json</text>
    <text x="974" y="192" text-anchor="middle" class="box-s">+ 定稿档案</text>
  </g>
  <line x1="186" y1="164" x2="230" y2="164" stroke="#1677ff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="208" y="152" text-anchor="middle" class="edge">原文</text>
  <line x1="386" y1="164" x2="430" y2="164" stroke="#1677ff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="408" y="152" text-anchor="middle" class="edge">故事</text>
  <line x1="586" y1="164" x2="630" y2="164" stroke="#1677ff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="608" y="152" text-anchor="middle" class="edge">条目</text>
  <line x1="804" y1="164" x2="858" y2="164" stroke="#1677ff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="831" y="152" text-anchor="middle" class="edge">通过后</text>
  <g filter="url(#shadow)">
    <rect x="236" y="320" width="350" height="78" rx="12" fill="#fff" stroke="#d9d9d9" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="411" y="352" text-anchor="middle" class="box-t">旁路：批量 AI → 待审库</text>
    <text x="411" y="376" text-anchor="middle" class="box-s">产出 Step1 草稿 →「开始人审」回到工作台 SOP</text>
  </g>
  <path d="M 111 208 L 111 358 L 236 358" fill="none" stroke="#8c8c8c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <path d="M 586 358 L 640 358 L 640 216" fill="none" stroke="#8c8c8c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="150" y="290" class="hint">可选</text>
  <text x="656" y="300" class="hint">回工作台</text>
  <rect x="36" y="440" width="1048" height="56" rx="10" fill="#fff" stroke="#f0f0f0"/>
  <text x="56" y="474" class="hint">说明：实线为主路径；虚线为批量旁路。Step2 通过还不算定稿，必须以 check 通过为入库门禁。</text>
</svg>