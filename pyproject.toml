[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-requirement-loop"
version = "0.1.0"
description = "量潮产品需求梳理智能体：把官方产品日志整理成需求故事与定稿 JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "openai>=1.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint>=2.0",
  "jsonschema>=4.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_requirement_loop = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "project"]
